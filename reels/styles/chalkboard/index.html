<!doctype html>
<html><head><meta charset="utf-8">
<title>LangCard - chalkboard</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
@font-face{font-family:"LCKR";src:url("fonts/NotoSansKR-Bold.ttf");font-weight:700;font-display:block}
@font-face{font-family:"LCJP";src:url("fonts/NotoSansJP-Bold.ttf");font-weight:700;font-display:block}
@font-face{font-family:"LCSC";src:url("fonts/NotoSansSC-Bold.ttf");font-weight:700;font-display:block}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script src="common/timeline.js"></script>
<script src="common/layout.js"></script>
<script>
// ===== LangCard / Chalkboard 스타일 — 1080x1920, 결정적 render(t) =====
// 분필 글씨는 폰트 글리프를 슬라이스 클립으로 "써 내려가고", 전체 레이어에 분필 입자(destination-out)를 입힌다.
// (STYLE.md의 획순 엔진은 쓰지 않음 — 한글·일본어·중국어 전 글자의 획 데이터가 없으므로. README의 한계 참조)
const W = 1080, H = 1920;
const SAFE = LCL.SAFE;   // x 80~1000, y 300~1480 (common/layout.js)
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const cc = mk(W, H), cx2 = cc.getContext('2d');           // 분필 레이어

// 분필 색 3종(+옅은 색): 흰 분필=구조, 노란 분필=정답/강조, 붉은 분필=오답
const WHITE = '#f3f1e7', PALE = '#bcc9bd', YELLOW = '#ffe27a', RED = '#ff8a78';

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eo = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hstr = s => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.codePointAt(0), 16777619); return h >>> 0; };

let tl = null, LAY = {}, TX = [], LANG = 'en';
let bg = null, grain = null;

// ---------- 글꼴 ----------
const STACK = { ko: 'Fredoka, LCKR, LCJP, LCSC, sans-serif', tg: null };
const fontStr = (kind, size) => `700 ${size}px ${STACK[kind]}`;

// ---------- 줄바꿈·자동 축소·쌓기·말풍선 배치는 common/layout.js (LCL.make) ----------
let LX = null;

// ---------- 분필 입자·획 ----------
function makeGrain() {
  const t = mk(256, 256), g = t.getContext('2d'), im = g.createImageData(256, 256), r = rng(777);
  for (let i = 0; i < 256 * 256; i++) { const v = r(); const a = v < .30 ? 255 * (.35 + .65 * r()) : (v < .36 ? 120 : 0); im.data[i * 4 + 3] = a; }
  g.putImageData(im, 0, 0);
  // 압력 얼룩: 큰 덩어리 한 겹
  const t2 = mk(512, 512), g2 = t2.getContext('2d'), r2 = rng(31);
  for (let i = 0; i < 260; i++) { g2.fillStyle = `rgba(0,0,0,${.05 + .08 * r2()})`; g2.beginPath(); g2.arc(r2() * 512, r2() * 512, 10 + r2() * 38, 0, 7); g2.fill(); }
  return { fine: cx2.createPattern(t, 'repeat'), blot: cx2.createPattern(t2, 'repeat') };
}
function makeBoard() {
  const c = mk(W, H), g = c.getContext('2d');
  g.fillStyle = '#5b3d22'; g.fillRect(0, 0, W, H);
  const bx = 26, by = 26, bw = W - 52, bh = 1760 - by;      // 칠판 면
  const gr = g.createRadialGradient(540, 760, 120, 540, 760, 1100); gr.addColorStop(0, '#264a39'); gr.addColorStop(1, '#14291f');
  g.fillStyle = gr; g.fillRect(bx, by, bw, bh);
  // 느린 얼룩(깨끗한 판: 낡은 흔적 없음)
  const r = rng(5);
  for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(${r() < .5 ? '255,255,255' : '0,0,0'},${.004 + .007 * r()})`; g.beginPath(); g.ellipse(bx + r() * bw, by + r() * bh, 120 + r() * 300, 90 + r() * 220, r() * 3, 0, 7); g.fill(); }
  const im = g.getImageData(bx, by, bw, bh), d = im.data, r2 = rng(9);
  for (let i = 0; i < d.length; i += 4) { const n = (r2() - .5) * 9; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(im, bx, by);
  // 나무 틀: 안쪽 그림자 + 하이라이트
  g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 10; g.strokeRect(bx + 5, by + 5, bw - 10, bh - 10);
  const wg = g.createLinearGradient(0, 0, W, 0); wg.addColorStop(0, '#7a5230'); wg.addColorStop(.5, '#8a6038'); wg.addColorStop(1, '#6d4828');
  g.fillStyle = wg; g.fillRect(0, 0, W, by); g.fillRect(0, 0, bx, H); g.fillRect(W - bx, 0, bx, H);
  g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(0, 0, W, 4); g.fillRect(0, 0, 4, H);
  // 분필 받침대
  g.fillStyle = '#7d5632'; g.fillRect(0, 1760, W, 70); g.fillStyle = '#9a7143'; g.fillRect(0, 1760, W, 12); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 1830, W, 6);
  g.fillStyle = '#4e331b'; g.fillRect(0, 1836, W, H - 1836);
  const stick = (x, y, w, col) => { g.fillStyle = col; g.fillRect(x, y, w, 16); g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x, y + 11, w, 5); };
  stick(120, 1744, 110, WHITE); stick(250, 1748, 80, YELLOW); stick(340, 1746, 62, RED);
  g.fillStyle = '#6b5a45'; g.fillRect(790, 1730, 170, 30); g.fillStyle = '#1c1c1c'; g.fillRect(790, 1730, 170, 16);   // 칠판지우개
  return c;
}

const jit = (seed, i) => (rng(seed + i * 977)() - .5);
function resample(pts, step, amp, seed) {     // 손맛: 일정 간격으로 쪼개 살짝 흔든다
  const out = []; let k = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.round(L / step));
    for (let j = 0; j < n; j++, k++) { const u = j / n; out.push([lerp(x0, x1, u) + jit(seed, k * 2) * amp, lerp(y0, y1, u) + jit(seed, k * 2 + 1) * amp]); }
  }
  out.push(pts[pts.length - 1]); return out;
}
function poly(c, pts, p, width, color, seed) {
  if (p <= 0) return;
  const P = resample(pts, 14, 1.6, seed || 1); let tot = 0; const seg = [];
  for (let i = 0; i < P.length - 1; i++) { const l = Math.hypot(P[i + 1][0] - P[i][0], P[i + 1][1] - P[i][1]); seg.push(l); tot += l; }
  let want = tot * clamp(p), ac = 0;
  c.save(); c.strokeStyle = color; c.lineWidth = width; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(P[0][0], P[0][1]);
  for (let i = 0; i < seg.length; i++) {
    if (ac + seg[i] <= want) { c.lineTo(P[i + 1][0], P[i + 1][1]); ac += seg[i]; }
    else { const u = (want - ac) / seg[i]; c.lineTo(lerp(P[i][0], P[i + 1][0], u), lerp(P[i][1], P[i + 1][1], u)); break; }
  }
  c.stroke(); c.restore();
}
function rrPts(x, y, w, h, r) {
  const a = [], arc = (cx, cy, a0) => { for (let i = 0; i <= 4; i++) { const t = a0 + i * Math.PI / 8; a.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]); } };
  a.push([x + r, y]); a.push([x + w - r, y]); arc(x + w - r, y + r, -Math.PI / 2);
  a.push([x + w, y + h - r]); arc(x + w - r, y + h - r, 0);
  a.push([x + r, y + h]); arc(x + r, y + h - r, Math.PI / 2);
  a.push([x, y + r]); arc(x + r, y + r, Math.PI); a.push([x + r + 2, y]);
  return a;
}

// ---------- 글씨 쓰기 ----------
// B: fit() 결과 + {cx,y} (가운데 정렬) 또는 {x}(왼쪽 정렬). p: 쓰기 진행 0~1. 읽을 글씨는 보고(rep)되어 readcheck가 본다.
function put(c, B, p, color, o) {
  o = o || {};
  if (p <= 0) return;
  const total = B.lw.reduce((a, b) => a + b, 0), reveal = clamp(p) * total;
  const m = c.getTransform(), sc = m.a;
  let cum = 0, x0box = 1e9, x1box = -1e9;
  c.save(); c.font = fontStr(B.kind, B.size); c.textBaseline = 'middle'; c.fillStyle = color; c.strokeStyle = color; c.lineWidth = Math.max(1.2, B.size * .018); c.lineJoin = 'round';
  B.lines.forEach((ln, i) => {
    const lw = B.lw[i], lx = o.left != null ? o.left : B.cx - lw / 2, top = B.y + i * B.lhp;
    x0box = Math.min(x0box, lx); x1box = Math.max(x1box, lx + lw);
    const rw = clamp((reveal - cum) / lw) * lw; cum += lw;
    if (rw <= 0) return;
    const slant = B.size * .3, full = rw >= lw - .01;
    c.save(); c.beginPath();
    if (full) c.rect(lx - 6, top - 4, lw + 12, B.lhp + 8);
    else { c.moveTo(lx - 6, top - 4); c.lineTo(lx + rw + slant, top - 4); c.lineTo(lx + rw - slant, top + B.lhp + 4); c.lineTo(lx - 6, top + B.lhp + 4); c.closePath(); }
    c.clip();
    const ty = top + B.lhp / 2;
    c.fillText(ln, lx, ty); c.strokeText(ln, lx, ty);
    c.restore();
    if (!full) {   // 쓰는 끝에서 튀는 가루 몇 알
      const R = rng(hstr(B.id || B.text) + Math.floor((o.t || 0) * 24) * 31 + i);
      c.fillStyle = color;
      for (let k = 0; k < 5; k++) { c.globalAlpha = .5 + .4 * R(); c.fillRect(lx + rw + (R() - .3) * 26, top + B.lhp * (.2 + .6 * R()), 1 + R() * 2.2, 1 + R() * 2.2); }
      c.globalAlpha = 1;
    }
  });
  c.restore();
  if (o.rep !== false) {
    const y0 = B.y, y1 = B.y + B.h;
    TX.push({ id: B.id, text: B.text, x0: m.a * x0box + m.e, x1: m.a * x1box + m.e, y0: m.d * y0 + m.f, y1: m.d * y1 + m.f });
  }
}
const prog = (t, a, d) => clamp((t - a) / d);

// ---------- 레이아웃(폰트 로드 후 1회) ----------
const YC = 890;                                       // 콘텐츠 세로 중심(칠판 가운데). 글자는 y 300~1480 안
function layout() {
  const C = tl.C, L = {}, M = LCL.MIN, SF = LCL.SAFE;
  STACK.tg = LANG === 'ja' ? 'Fredoka, LCJP, LCKR, sans-serif' : LANG === 'zh' ? 'Fredoka, LCSC, LCKR, sans-serif' : 'Fredoka, LCKR, sans-serif';
  LX = LCL.make(cx2, fontStr);
  // 훅: 처음 2초 화면 가득(≥110px). 같은 줄바꿈 그대로 52px 제목으로 줄어 위에 남는다
  let hb = LX.fit(C.hook, 'ko', { maxW: 900, maxLines: 3, s0: 150, s1: M.hook, lh: 1.22 });
  if (hb.lines.length > 3 || hb.w > 901) hb = LX.fit(C.hook, 'ko', { maxW: 900, maxLines: 4, s0: M.hook, s1: 80, lh: 1.22 });
  hb.id = 'hook'; hb.cx = 540; hb.y = YC - 20 - hb.h / 2;
  const f = Math.min(1, M.title / hb.size);
  L.hook = { B: hb, f, cy: hb.y + hb.h / 2, titleTop: 292 };
  const titleBottom = 292 + f * hb.h;
  // WRONG / RIGHT: 같은 자리에 쓴다(쓰고 → 지우고 → 같은 자리에 다시). 제목 아래에서 시작해 y 1480까지
  const iconCy = titleBottom + 85, y0 = iconCy + 95, y1 = SF.bottom, mw = 900;
  L.wrong = { cy: iconCy, items: LX.stack([
    { id: 'wrong', text: C.wrong, kind: 'tg', s0: 130, s1: M.body, maxLines: 3, color: WHITE, lh: 1.22 },
    { id: 'wrongPh', text: C.wrongPh, kind: 'ko', s0: 68, s1: 40, maxLines: 2, color: PALE, gap: 44, lh: 1.28 }], y0, y1, mw) };
  L.right = { cy: iconCy, items: LX.stack([
    { id: 'right', text: C.right, kind: 'tg', s0: 130, s1: M.body, maxLines: 3, color: YELLOW, lh: 1.22 },
    { id: 'rightPh', text: C.rightPh, kind: 'ko', s0: 64, s1: 40, maxLines: 2, color: PALE, gap: 36, lh: 1.28 },
    { id: 'roman', text: C.roman, kind: 'tg', s0: 56, s1: 36, maxLines: 2, color: PALE, gap: 14, lh: 1.25 },
    { id: 'rightKo', text: C.rightKo, kind: 'ko', s0: 70, s1: 44, maxLines: 3, color: WHITE, gap: 46, lh: 1.3 }], y0, y1, mw) };
  // EXPLAIN: 한 줄 요약, 박스 안
  if (C.explain) {
    const b = LX.fit(C.explain, 'ko', { maxW: 780, maxLines: 5, s0: 104, s1: 60, lh: 1.36 });
    b.id = 'explain'; b.cx = 540; b.y = YC - b.h / 2; b.color = WHITE;
    L.explain = { B: b, box: [540 - b.w / 2 - 56, b.y - 60, b.w + 112, b.h + 120] };
  }
  // DIALOGUE: 2턴, 말풍선 공통 계산
  L.dialogue = LX.dialogue(C.dialogue, { y0: SF.top + 20, y1: SF.bottom, gap: 70 });
  L.dialogue.forEach((r, i) => { [r.a, r.b, r.c].forEach((p, k) => { if (p) p.color = (k === 0 && i === C.hl) ? YELLOW : (k === 1 ? PALE : WHITE); }); });
  // VOCAB: 카드 2장(세로 가운데)
  { const cards = C.vocab.map((v, i) => {
      const w = LX.fit(v.word, 'tg', { maxW: 640, maxLines: 1, s0: 140, s1: 72, lh: 1.15 }); w.id = 'v' + i + 'w'; w.color = YELLOW;
      const ty = v.type ? LX.fit(v.type, 'ko', { maxW: 230, maxLines: 1, s0: 44, s1: 32, lh: 1.2 }) : null; if (ty) { ty.id = 'v' + i + 't'; ty.color = PALE; }
      const m = v.meaning ? LX.fit(v.meaning, 'ko', { maxW: 900, maxLines: 2, s0: 66, s1: 44, lh: 1.28 }) : null; if (m) { m.id = 'v' + i + 'm'; m.color = WHITE; }
      const p = v.phonetic ? LX.fit(v.phonetic, 'ko', { maxW: 900, maxLines: 1, s0: 54, s1: 38, lh: 1.25 }) : null; if (p) { p.id = 'v' + i + 'p'; p.color = PALE; }
      const h = w.h + 16 + (m ? m.h : 0) + (p ? p.h + 6 : 0);
      return { w, ty, m, p, h };
    });
    const GAPC = 90, tot = cards.reduce((s, c) => s + c.h, 0) + GAPC * (cards.length - 1);
    let y = YC - tot / 2;
    cards.forEach(k => { k.top = y; k.w.y = y; let yy = y + k.w.h + 16; if (k.ty) k.ty.y = y + (k.w.h - k.ty.h) / 2 + 8; if (k.m) { k.m.y = yy; yy += k.m.h; } if (k.p) k.p.y = yy + 6; k.div = y + k.h + GAPC / 2; y += k.h + GAPC; });
    L.vocab = cards; }
  // CTA
  { const b = LX.fit(C.cta || C.handle, 'ko', { maxW: 900, maxLines: 4, s0: 108, s1: 60, lh: 1.28 }); b.id = 'cta'; b.cx = 540; b.color = YELLOW;
    const h = LX.fit(C.handle, 'ko', { maxW: 900, maxLines: 1, s0: 92, s1: 48, lh: 1.2 }); h.id = 'handle'; h.cx = 540; h.color = WHITE;
    const tot = 180 + 60 + b.h + 40 + 110 + h.h; let y = YC - tot / 2;
    L.cta = { iconY: y, b, h }; b.y = y + 180 + 60; h.y = b.y + b.h + 40 + 110; }
  LAY = L;
}

// ---------- 장면 그리기(분필 레이어 cx2에) ----------
function drawHook(c, t) {
  const L = LAY.hook, B = L.B, hk = tl.by.hook;
  if (t >= hk.titleUntil) return;
  const [m0, m1] = hk.cue.move, mv = ease((t - m0) / (m1 - m0));
  const pop = t < .6 ? 1 + .35 * Math.exp(-t * 11) * Math.cos(t * 26) : 1;      // 0초에 크게 뛰어들어 튕김
  const sc = pop * lerp(1, L.f, mv);
  const tx = 540, ty = lerp(L.cy, L.titleTop + L.f * B.h / 2, mv);
  const shake = t > .16 && t < .7 ? Math.exp(-(t - .16) * 8) : 0;
  c.save();
  c.translate(tx + Math.sin(t * 95) * 9 * shake, ty + Math.cos(t * 83) * 6 * shake); c.scale(sc, sc); c.translate(-540, -L.cy);
  put(c, B, 1, WHITE, { t, rep: true });
  const u = B.y + B.h + 8, zz = [], n = 9, ww = B.w * .5;     // 노란 지그재그 밑줄(.3~.85초에 휙)
  for (let i = 0; i <= n; i++) zz.push([540 - ww + (2 * ww) * i / n, u + (i % 2 ? 14 : -4)]);
  poly(c, zz, prog(t, .3, .55), 12, YELLOW, 11);
  c.restore();
  const age = t - .16;      // 쾅 하는 순간 분필 가루
  if (age > 0 && age < .7) {
    const R = rng(4242); c.save(); c.fillStyle = WHITE;
    for (let i = 0; i < 46; i++) {
      const a = R() * 6.283, v = 260 + R() * 520, r = (1 - Math.pow(1 - age / .7, 2)) * v * .5;
      c.globalAlpha = (1 - age / .7) * .85; c.fillRect(540 + Math.cos(a) * (r + 120), L.cy + Math.sin(a) * (r * .8 + 60), 2 + R() * 3, 2 + R() * 3);
    }
    c.restore();
  }
}
function iconCross(c, cy, p) {
  poly(c, [[484, cy - 56], [596, cy + 56]], prog(p, 0, .5), 22, RED, 3);
  poly(c, [[596, cy - 56], [484, cy + 56]], prog(p, .45, .55), 22, RED, 4);
}
function iconCheck(c, cy, p) { poly(c, [[472, cy], [524, cy + 58], [616, cy - 58]], prog(p, 0, 1), 24, YELLOW, 5); }
function drawWrong(c, t, sc) {
  const cu = sc.cue, L = LAY.wrong, rep = t < sc.t1;
  iconCross(c, L.cy, (t - cu.icon) / .45);
  L.items.forEach(B => {
    put(c, B, prog(t, B.id === 'wrong' ? cu.text : cu.ph, tlWrite(B.text)), B.color, { t, rep });
    if (B.id === 'wrong' && t > cu.strike) {     // 음성이 끝나면 오답 줄에 붉은 분필로 긋기
      B.lines.forEach((ln, i) => { const lx = B.cx - B.lw[i] / 2, my = B.y + i * B.lhp + B.lhp * .52;
        poly(c, [[lx - 16, my + 6], [lx + B.lw[i] + 16, my - 8]], prog(t, cu.strike + i * .15, .3), 14, RED, 20 + i); });
    }
  });
}
function drawRight(c, t, sc) {
  const cu = sc.cue, L = LAY.right, rep = t < sc.t1, st = { right: cu.text, rightPh: cu.ph, roman: cu.roman, rightKo: cu.ko };
  iconCheck(c, L.cy, (t - cu.icon) / .45);
  L.items.forEach(B => put(c, B, prog(t, st[B.id], tlWrite(B.text)), B.color, { t, rep }));
  const R = L.items[0]; if (R && t > cu.text + tlWrite(R.text)) {      // 정답 줄 아래 노란 밑줄
    const last = R.lines.length - 1, lx = R.cx - R.lw[last] / 2, uy = R.y + R.h - R.lhp * .08;
    poly(c, [[lx, uy + 4], [lx + R.lw[last], uy - 3]], prog(t, cu.text + tlWrite(R.text), .35), 9, YELLOW, 33);
  }
}
function drawExplain(c, t, sc) {
  const cu = sc.cue, L = LAY.explain, rep = t < sc.t1, [bx, by, bw, bh] = L.box;
  poly(c, rrPts(bx, by, bw, bh, 38), prog(t, cu.box, .6), 7, PALE, 41);
  put(c, L.B, prog(t, cu.text, tlWrite(L.B.text)), WHITE, { t, rep });
}
function bubble(c, t, r, cu, i) {
  const hl = i === tl.C.hl, p = (t - cu.bubble) / .4;
  poly(c, rrPts(r.x, r.y, r.w, r.h, 34), prog(p, 0, 1), hl ? 9 : 6, hl ? YELLOW : WHITE, 60 + i);
  const ty = r.side === 'L' ? [[r.x + 64, r.y + r.h - 1], [r.x + 34, r.y + r.h + 30], [r.x + 124, r.y + r.h - 1]] : [[r.x + r.w - 64, r.y + r.h - 1], [r.x + r.w - 34, r.y + r.h + 30], [r.x + r.w - 124, r.y + r.h - 1]];
  poly(c, ty, prog(p, .8, .2), hl ? 9 : 6, hl ? YELLOW : WHITE, 70 + i);
}
function drawDialogue(c, t, sc) {
  const rep = t < sc.t1;
  LAY.dialogue.forEach((r, i) => {
    const cu = sc.cue.turns[i]; if (t < cu.bubble) return;
    bubble(c, t, r, cu, i);
    [[r.a, cu.line], [r.b, cu.ph], [r.c, cu.ko]].forEach(([B, st]) => B && put(c, B, prog(t, st, tlWrite(B.text)), B.color, { t, rep }));
  });
}
function drawVocab(c, t, sc) {
  const rep = t < sc.t1;
  LAY.vocab.forEach((k, i) => {
    const cu = sc.cue.cards[i]; if (t < cu.word) return;
    put(c, k.w, prog(t, cu.word, tlWrite(k.w.text)), YELLOW, { t, rep, left: SAFE.x0 + 10 });
    if (k.ty) put(c, Object.assign(k.ty, { cx: 0 }), prog(t, cu.type, tlWrite(k.ty.text)), PALE, { t, rep, left: SAFE.x1 - k.ty.lw[0] - 10 });
    if (k.m) put(c, k.m, prog(t, cu.meaning, tlWrite(k.m.text)), WHITE, { t, rep, left: SAFE.x0 + 10 });
    if (k.p) put(c, k.p, prog(t, cu.ph, tlWrite(k.p.text)), PALE, { t, rep, left: SAFE.x0 + 10 });
    if (i < LAY.vocab.length - 1) poly(c, [[SAFE.x0, k.div + 3], [SAFE.x1, k.div - 3]], prog(t, cu.word + .2, .5), 4, PALE, 90 + i);
  });
}
function drawCta(c, t, sc) {
  const cu = sc.cue, L = LAY.cta, rep = t < sc.t1, bx = 540, by = L.iconY;
  poly(c, [[bx - 64, by], [bx + 64, by], [bx + 64, by + 160], [bx, by + 116], [bx - 64, by + 160], [bx - 64, by]], prog(t, cu.icon, .6), 14, YELLOW, 8);
  put(c, L.b, prog(t, cu.text, tlWrite(L.b.text)), YELLOW, { t, rep });
  const ye = L.b.y + L.b.h + 26;
  poly(c, [[540 - L.b.w / 2, ye + 6], [540 + L.b.w / 2, ye - 6]], prog(t, cu.text + tlWrite(L.b.text), .4), 9, YELLOW, 15);
  put(c, L.h, prog(t, cu.handle, tlWrite(L.h.text)), WHITE, { t, rep });
}
const tlWrite = tx => LC.writeDur(tx);
const DRAW = { hook: () => {}, wrong: drawWrong, right: drawRight, explain: drawExplain, dialogue: drawDialogue, vocab: drawVocab, cta: drawCta };

// ---------- 지우개 ----------
const WIPE_BOT = 1560;
function eraser(t, sc) {
  const p = ease((t - sc.t1) / sc.wipe), top = sc.wipeTop || 270;
  return { front: lerp(-60, W + 140, p), top, bot: WIPE_BOT, p };
}
function drawEraserSprite(g, e) {
  const x = e.front, y0 = e.top - 20, h = e.bot - e.top + 40, w = 150;
  g.save();
  g.fillStyle = '#1b1b1b'; g.fillRect(x - w, y0, w, h);
  const wg = g.createLinearGradient(x - w - 60, 0, x - w, 0); wg.addColorStop(0, '#9a7143'); wg.addColorStop(1, '#7b5630');
  g.fillStyle = wg; g.fillRect(x - w - 70, y0, 70, h);
  g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x - w - 70, y0, 70, 6);
  g.fillStyle = 'rgba(243,241,231,.35)'; for (let i = 0; i < 40; i++) { const r = rng(i * 13 + 5); g.fillRect(x - w + 6 + r() * 130, y0 + r() * h, 2 + r() * 3, 1 + r() * 2); }
  g.restore();
}

// ---------- 합성 ----------
// 장면 전환: 지우개가 prev.t1~prev.t1+WIPE에 훑고 지나가며, 새 장면은 이미 시작되어 지나간 자리(왼쪽)에 바로 쓰인다.
function render(t) {
  TX = [];
  if (!tl) return;
  const sc = tl.scenes;
  ctx.drawImage(bg, 0, 0);
  const c = cx2; c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; c.clearRect(0, 0, W, H);
  let i = 0; for (let k = 0; k < sc.length; k++) if (sc[k].t0 <= t) i = k;
  const cur = sc[i], prev = i > 0 ? sc[i - 1] : null, hk = tl.by.hook;
  const wiping = !!(prev && prev.wipe && t >= prev.t1 && t < prev.t1 + prev.wipe);
  const er = wiping ? eraser(t, prev) : null;
  const titleOn = t < hk.titleUntil, titleWipe = wiping && prev.id === 'right';
  const region = (x, y, w, h) => { c.beginPath(); c.rect(0, 0, W, H); c.rect(x, y, w, h); c.clip('evenodd'); };
  if (wiping) {
    c.save(); region(0, er.top, Math.max(0, er.front - 30), er.bot - er.top);          // 지우개 오른쪽 = 아직 안 지워진 옛 장면
    DRAW[prev.id](c, t, prev); if (titleWipe) drawHook(c, t); c.restore();
    c.save(); region(er.front - 30, er.top, W, er.bot - er.top);                        // 지우개 왼쪽 = 새 장면
    DRAW[cur.id](c, t, cur); c.restore();
    if (titleOn && !titleWipe) drawHook(c, t);
  } else {
    if (titleOn) drawHook(c, t);
    DRAW[cur.id](c, t, cur);
  }
  // 분필 입자: 큰 얼룩 + 고운 알갱이를 뚫어 거친 분필 질감
  c.globalCompositeOperation = 'destination-out';
  c.fillStyle = grain.blot; c.fillRect(0, 0, W, H);
  c.save(); c.fillStyle = grain.fine; c.globalAlpha = .55; c.fillRect(0, 0, W, H); c.restore();
  c.globalCompositeOperation = 'source-over';
  if (er) { ctx.save(); ctx.globalAlpha = .07 * (1 - er.p); ctx.fillStyle = WHITE; ctx.fillRect(0, er.top, Math.max(0, er.front - 40), er.bot - er.top); ctx.restore(); }
  ctx.drawImage(cc, 0, 0);
  if (er) drawEraserSprite(ctx, er);
}

window.DUR = 1; window.EV = [];
window.render = render;
window.TEXTS = () => LC.texts(TX);
// 검수용(선택): 분필 레이어에서 y 300~1500의 칠해진 픽셀 수 — 빈 칠판 구간 검사에 쓴다
window.CHALKPIX = () => { const d = cx2.getImageData(0, 300, W, 1200).data; let n = 0; for (let i = 3; i < d.length; i += 64) if (d[i] > 100) n++; return n; };
(async function init() {
  try {
    const { input, dur, opts } = await LC.load();
    LANG = input.lang;
    tl = LC.buildAuto(input, dur, opts);
    window.DUR = tl.DUR; window.EV = tl.EV;
    // 글꼴 로드 대기: 실제로 쓰는 글자로 요청해야 unicode-range 조각도 내려받는다
    const sample = [tl.C.hook, tl.C.wrong, tl.C.right, tl.C.explain, tl.C.cta, tl.C.rightKo, tl.C.rightPh, tl.C.roman, ...tl.C.vocab.flatMap(v => [v.word, v.meaning, v.phonetic, v.type]),
      ...tl.C.dialogue.flatMap(d => [d.line, d.ph, d.ko]), '@langcard.studio 0123456789'].join(' ');
    await Promise.all(['LCKR', 'LCJP', 'LCSC', 'Fredoka'].map(f => document.fonts.load(`700 40px ${f}`, sample)));
    await document.fonts.ready;
    bg = makeBoard(); grain = makeGrain();
    layout();
    window.READY = true;
  } catch (e) { console.error('init failed', e); throw e; }
})();
</script></body></html>
